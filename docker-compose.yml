services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: 1Qwerty
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: always

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: always

  service:
    build: .
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    ports:
      - "8082:8082"
    volumes:
      - ./configs:/configs
      - ./.env.docker:/.env
      - ./migrations:/migrations
    depends_on:
      - postgres
    restart: always
